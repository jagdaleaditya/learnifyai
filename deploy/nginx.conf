# LearnifyAI: production Nginx config (HTTPS only).
# 1. Replace learnify.example.com with your domain (3 places).
# 2. Get a certificate:  sudo certbot certonly --nginx -d learnify.example.com
# 3. sudo cp deploy/nginx.conf /etc/nginx/sites-available/learnify
#    sudo ln -s /etc/nginx/sites-available/learnify /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx

# Per-IP request limits (abuse / brute-force protection)
limit_req_zone $binary_remote_addr zone=learnify_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=learnify_heavy:10m rate=12r/m;

# Plain HTTP: only used to redirect to HTTPS (and for certbot renewals).
server {
    listen 80;
    listen [::]:80;
    server_name learnify.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;        # nginx >= 1.25.1 may prefer "listen 443 ssl;" + "http2 on;"
    listen [::]:443 ssl http2;
    server_name learnify.example.com;

    ssl_certificate     /etc/letsencrypt/live/learnify.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnify.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LearnifySSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 5m;
    root /var/www/learnify;
    index index.html;

    # Security headers (always = also on error pages)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → Node backend on localhost
    location /api/ {
        limit_req zone=learnify_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, do not trust client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;                              # live progress for course generation (SSE)
        # The API's own copies of these headers are dropped so each header is sent exactly once.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Powered-By;
    }
    location ~ ^/api/(generate|run|fix|chat|slide/) {
        limit_req zone=learnify_heavy burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
        # The API's own copies of these headers are dropped so each header is sent exactly once.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Powered-By;
    }

    # Hashed build assets can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never serve dotfiles or source maps
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.map$ { deny all; }

    # Single-page app: unknown paths load index.html (never cached, so deploys show up at once)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; frame-src https://accounts.google.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        try_files $uri /index.html;
    }
}
