services:
  # ── Backend API (Node/Express) ──────────────────────────────────────────────
  - type: web
    name: learnifyai-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: ALLOW_REMOTE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_HTTPS
        value: "1"
      - key: ENABLE_CODE_RUN
        value: "1"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: HEAVY_LIMIT_PER_MIN
        value: "10"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      # ── Secret keys — set these in the Render dashboard ──
      # - key: GROQ_API_KEY
      #   value: <set in dashboard>
      # - key: GROQ_MODEL
      #   value: llama-3.3-70b-versatile
      # - key: GEMINI_API_KEY
      #   value: <set in dashboard>
      # - key: GEMINI_MODEL
      #   value: gemini-1.5-flash
      # - key: OLLAMA_API_KEY
      #   value: <set in dashboard>
      # - key: OLLAMA_HOST
      #   value: https://ollama.com
      # - key: OLLAMA_MODEL
      #   value: gpt-oss:120b
      # - key: ADMIN_TOKEN
      #   value: <generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))">
      # - key: ALLOWED_ORIGINS
      #   value: https://learnifyai-frontend.onrender.com

  # ── Frontend (Vite / React static site) ────────────────────────────────────
  - type: web
    name: learnifyai-frontend
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://learnifyai-api.onrender.com
      # - key: VITE_GOOGLE_API_KEY
      #   value: <set in dashboard>
